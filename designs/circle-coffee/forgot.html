<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Circle Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f6f1e7'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%231c3f6b'/%3E%3Ctext x='50' y='58' text-anchor='middle' font-size='28' fill='%23f27b66' font-family='Georgia'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-body">
  <div class="auth-topbar"></div>

<main class="auth-wrap">
  <form class="auth-card" action="login.html" method="get">
    <div class="auth-logo"><span class="logo-badge logo-lg" aria-hidden="true"><span class="bean-row"><i></i><i class="mid"></i><i></i></span><span class="logo-script">Circle</span><span class="logo-word">Coffee</span></span></div>
    <h1 class="auth-title-long">FORGOT PASSWORD</h1>
    <label class="field">
      <span class="field-label">Email Address:</span>
      <input type="email" autocomplete="email" required>
    </label>
    <div class="auth-actions">
      <button class="btn-coral" type="submit">SEND LINK</button>
    </div>
    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </form>
</main>
</body>
</html>
