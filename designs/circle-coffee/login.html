<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Circle Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f6f1e7'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%231c3f6b'/%3E%3Ctext x='50' y='58' text-anchor='middle' font-size='28' fill='%23f27b66' font-family='Georgia'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-body">
  <div class="auth-topbar"></div>

<main class="auth-wrap">
  <form class="auth-card" action="index.html" method="get">
    <div class="auth-logo"><span class="logo-badge logo-lg" aria-hidden="true"><span class="bean-row"><i></i><i class="mid"></i><i></i></span><span class="logo-script">Circle</span><span class="logo-word">Coffee</span></span></div>
    <h1>LOG IN</h1>
    <label class="field">
      <span class="field-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.2c1.4-3 3.8-4.5 7-4.5s5.6 1.5 7 4.5"/></svg>Username:</span>
      <input type="text" autocomplete="username" required>
    </label>
    <div class="field">
      <label>
        <span class="field-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/></svg>Password:</span>
        <input type="password" autocomplete="current-password" required>
      </label>
      <a class="forgot" href="forgot.html">Forgot password?</a>
    </div>
    <div class="auth-actions">
      <button class="btn-coral" type="submit">LOGIN</button>
    </div>
    <p class="auth-switch">Don't have an account yet? <a href="signup.html">Sign up</a></p>
  </form>
</main>
</body>
</html>
